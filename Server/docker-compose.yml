volumes:
  influxdb_data:

services:
  web:
    build: .
    expose:
      - "20309"                # Internal port for Flask app
    environment:
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=9zLi4IQTpm6EP6-NhnqWvWRYN8VfWF9MEoHDDVdwiZLUPPO0SUp7f0KAIb7ZpjFuR6g1HAtix_RnXUh3-6gFMA==
      - CLIENT_TOKEN_FILE=/app/client_token.txt
    depends_on:
      - influxdb
    healthcheck:
      test: ["CMD", "curl", "-f", "http://influxdb:30309/ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  influxdb:
    image: influxdb:latest
    expose:
      - "8086"
    ports:
      - "30309:8086"           # External port for InfluxDB
    volumes:
      - influxdb_data:/var/lib/influxdb2:rw
      - ./nginx/certs/fullchain.pem:/etc/ssl/fullchain.pem
      - ./nginx/certs/privkey.pem:/etc/ssl/privkey.pem
    environment:
      - INFLUXDB_DB=Heartbeat2809
      - INFLUXDB_ORG=Heartbeat
      - INFLUXDB_ADMIN_USER=admin
      - INFLUXDB_ADMIN_PASSWORD=admin_password
      - INFLUXD_TLS_CERT=/etc/ssl/fullchain.pem
      - INFLUXD_TLS_KEY=/etc/ssl/privkey.pem
  nginx:
    image: nginx:latest
    ports:
      - "20309:20309"          # Map external port 20309 to internal Nginx port 20309
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/certs:/etc/nginx/certs   # Mount SSL certificates
    depends_on:
      - web
